# Enable OSC 52 clipboard integration
set -s set-clipboard on

# Allow programs inside tmux to pass escape sequences directly to the terminal
# Only enable allow-passthrough if the tmux version is 3.3 or higher
if-shell -b '[ "$(echo "$(tmux -V | cut -c 6-) >= 3.3" | bc)" = 1 ]' \
  "set -g allow-passthrough on"

# Magic string that fixes the OSC 52 integration with gmosh.
set-option -ag terminal-overrides ",xterm-256color:Ms=\\E]52;c%p1%.0s;%p2%s\\7"

